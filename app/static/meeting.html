<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuộc họp</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="meeting">
<main>
  <p><a href="/">← Danh sách cuộc họp</a></p>

  <div class="card">
    <input type="text" class="title-input" id="title" aria-label="Tiêu đề">
    <div class="row" style="margin-top:8px; align-items:center">
      <label class="inline">Ngày <input type="date" id="date"></label>
      <span class="muted" id="meta"></span>
    </div>
    <div class="msg" id="status"></div>
    <div class="bar" id="bar" hidden><div></div></div>
    <div class="actions" style="margin-top:12px">
      <button id="copy">Copy bản ghi</button>
      <button id="download">Tải .md</button>
      <button id="rediarize">Tách lại người nói</button>
      <button id="retry" hidden>Chạy lại</button>
      <button id="delete" class="danger">Xóa</button>
    </div>
  </div>

  <div class="card" id="speakers-card" hidden>
    <strong>Người nói</strong>
    <div class="speakers" id="speakers"></div>
    <button id="save-speakers" class="primary">Lưu tên</button>
    <span class="msg muted" id="speakers-msg"></span>
  </div>

  <div class="player" id="player" hidden><audio id="audio" controls preload="metadata"></audio></div>

  <div class="card" id="transcript"></div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
