<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Transcriber</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Transcriber">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="window" id="window">
  <aside class="sidebar">
    <header class="sidebar-bar">
      <div class="segmented" role="tablist">
        <button role="tab" id="tab-meetings" class="on" data-i18n="tab.recordings"></button>
        <button role="tab" id="tab-chats" data-i18n="tab.ai"></button>
      </div>
      <button class="icon-btn" id="new" data-i18n-aria="new.aria">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      </button>
    </header>
    <nav class="list" id="list" data-i18n-aria="list.aria"></nav>
    <nav class="list" id="chat-list" data-i18n-aria="chats.aria" hidden></nav>
    <footer class="sidebar-foot">
      <div class="drop-hint" id="drop-hint" data-i18n="drop.hint"></div>
      <div class="foot-row">
        <button class="foot-btn" id="open-settings">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M14.2 8h-1.6M3.4 8H1.8M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1M12.4 12.4l-1.1-1.1M4.7 4.7 3.6 3.6"/></svg>
          <span data-i18n="settings.open"></span>
        </button>
        <div class="segmented lang-switch" role="radiogroup" data-i18n-aria="lang.aria">
          <button role="radio" data-lang="vi" title="Tiếng Việt">VI</button>
          <button role="radio" data-lang="en" title="English">EN</button>
        </div>
      </div>
    </footer>
  </aside>

  <main class="detail" id="detail">
    <header class="toolbar">
      <button class="icon-btn back" id="back" data-i18n-title="back" data-i18n-aria="back">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
      </button>
      <div class="grow"></div>
      <button class="text-btn" id="retry" data-i18n="retry" hidden></button>
      <button class="text-btn ask" id="ask" data-i18n-title="ask.title" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l1.4 3.6 3.6 1.4-3.6 1.4L8 11.5 6.6 7.9 3 6.5l3.6-1.4zM12.8 10.5l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z"/></svg>
        <span data-i18n="tab.ai"></span>
      </button>
      <button class="icon-btn" id="copy" data-i18n-title="copy" data-i18n-aria="copy">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="7.5" height="8.5" rx="1.8"/><path d="M3 10.5V4a2 2 0 0 1 2-2h5"/></svg>
      </button>
      <button class="icon-btn" id="download" data-i18n-title="download" data-i18n-aria="download">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v7.5M5 7l3 3 3-3M3 13h10"/></svg>
      </button>
      <button class="icon-btn" id="delete" data-i18n-title="delete.recording" data-i18n-aria="delete.recording">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.2 4.5V3h3.6v1.5M4.6 4.5l.6 8.5h5.6l.6-8.5"/></svg>
      </button>
    </header>

    <div class="scroll" id="scroll">
      <section class="empty" id="empty">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="19" y="6" width="10" height="22" rx="5"/><path d="M12 22a12 12 0 0 0 24 0M24 34v8M17 42h14"/></svg>
        <p id="empty-text"></p>
        <button class="primary-btn" id="empty-new" data-i18n="empty.new" hidden></button>
      </section>

      <article class="meeting" id="meeting" hidden>
        <input class="title" id="title" data-i18n-aria="title.aria" spellcheck="false">
        <div class="meta">
          <span class="date-wrap">
            <button type="button" class="date" id="date-btn" data-i18n-title="date.change"></button>
            <input type="date" id="date" tabindex="-1" data-i18n-aria="date.aria">
          </span>
          <span id="meta"></span>
          <a class="source-link" id="source-link" target="_blank" rel="noopener noreferrer" hidden>YouTube ↗</a>
        </div>

        <div class="status" id="status" hidden>
          <div class="status-text" id="status-text"></div>
          <div class="progress"><div id="progress"></div></div>
        </div>

        <div class="player" id="player" hidden>
          <input type="range" class="scrub" id="scrub" min="0" max="1000" value="0" data-i18n-aria="scrub.aria">
          <div class="times"><span id="t-now">0:00</span><span id="t-left">-0:00</span></div>
          <div class="controls">
            <button class="speed" id="speed" data-i18n-title="speed">1×</button>
            <button class="ctl" id="back15" data-i18n-title="back15" data-i18n-aria="back15">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v3.2h3.2"/><text x="12" y="15.2">15</text></svg>
            </button>
            <button class="play" id="play" data-i18n-aria="play">
              <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6l7.6-4.8z"/></svg>
              <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="3" width="2.8" height="10" rx="1"/><rect x="9.2" y="3" width="2.8" height="10" rx="1"/></svg>
            </button>
            <button class="ctl" id="fwd15" data-i18n-title="fwd15" data-i18n-aria="fwd15">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v3.2h-3.2"/><text x="12" y="15.2">15</text></svg>
            </button>
            <span class="speed-spacer"></span>
          </div>
          <audio id="audio" preload="metadata"></audio>
        </div>

        <div class="transcript" id="transcript"></div>
      </article>
    </div>
  </main>

  <main class="detail chat-pane" id="chat-pane" hidden>
    <header class="toolbar">
      <button class="icon-btn back" id="chat-back" data-i18n-title="back" data-i18n-aria="back">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
      </button>
      <input class="chat-title" id="chat-title" data-i18n-aria="chat.title.aria" spellcheck="false">
      <select class="select" id="chat-provider" data-i18n-aria="chat.provider.aria"></select>
      <button class="icon-btn" id="chat-delete" data-i18n-title="chat.delete" data-i18n-aria="chat.delete">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.2 4.5V3h3.6v1.5M4.6 4.5l.6 8.5h5.6l.6-8.5"/></svg>
      </button>
    </header>
    <div class="scope" id="chat-scope"></div>
    <div class="scroll" id="chat-scroll">
      <div class="messages" id="messages"></div>
    </div>
    <footer class="composer">
      <div class="notice" id="chat-notice" hidden></div>
      <div class="suggestions" id="suggestions"></div>
      <form class="prompt-box" id="composer">
        <textarea id="prompt" rows="1" data-i18n-ph="prompt.ph" data-i18n-aria="prompt.aria"></textarea>
        <button type="submit" class="send" id="send" data-i18n-aria="send" disabled>
          <svg class="i-send" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
          <svg class="i-stop" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5"/></svg>
        </button>
      </form>
      <p class="hint" data-i18n="hint.enter"></p>
    </footer>
  </main>
</div>

<div class="drop-overlay" id="drop-overlay" hidden><div data-i18n="drop.overlay"></div></div>

<dialog class="sheet" id="sheet">
  <form method="dialog" id="upload-form">
    <h2 data-i18n="sheet.title"></h2>
    <div class="segmented sheet-tabs" role="tablist">
      <button type="button" role="tab" id="src-file" class="on" data-i18n="src.file"></button>
      <button type="button" role="tab" id="src-yt" data-i18n="src.yt"></button>
    </div>
    <label class="field" id="yt-field" hidden><span data-i18n="yt.label"></span>
      <input type="url" id="f-url" placeholder="https://www.youtube.com/watch?v=…" spellcheck="false" autocomplete="off">
      <small data-i18n="yt.help"></small>
    </label>
    <label class="file-pick" id="file-pick">
      <input type="file" id="file" accept="audio/*,video/*" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
      <span id="file-name"></span>
    </label>
    <label class="field"><span data-i18n="f.title"></span><input type="text" id="f-title"></label>
    <label class="field"><span data-i18n="f.date"></span><input type="date" id="f-date">
      <small id="date-hint" data-i18n="date.hint" hidden></small>
    </label>
    <label class="field"><span data-i18n="f.keywords"></span>
      <input type="text" id="f-keywords" data-i18n-ph="f.keywords.ph">
      <small data-i18n="f.keywords.help"></small>
    </label>
    <div class="progress" id="upload-progress" hidden><div></div></div>
    <p class="sheet-msg" id="upload-msg"></p>
    <div class="sheet-actions">
      <button type="button" class="secondary-btn" id="cancel" data-i18n="cancel"></button>
      <button type="submit" class="primary-btn" id="submit" disabled></button>
    </div>
  </form>
</dialog>

<dialog class="sheet" id="picker">
  <form method="dialog" id="picker-form">
    <h2 id="picker-title"></h2>
    <div class="pick-list" id="pick-list"></div>
    <p class="sheet-msg" id="picker-msg"></p>
    <div class="sheet-actions">
      <button type="button" class="secondary-btn" id="picker-cancel" data-i18n="cancel"></button>
      <button type="submit" class="primary-btn" id="picker-ok"></button>
    </div>
  </form>
</dialog>

<dialog class="sheet wide" id="settings">
  <div class="settings">
    <h2 data-i18n="settings.open"></h2>
    <p class="sheet-sub" data-i18n="settings.sub"></p>
    <div class="provider-list" id="provider-list"></div>
    <form class="provider-form" id="provider-form" hidden>
      <h3 id="pf-heading"></h3>
      <label class="field"><span data-i18n="pf.name"></span><input type="text" id="pf-name" data-i18n-ph="pf.name.ph"></label>
      <label class="field"><span data-i18n="pf.provider"></span>
        <select class="select" id="pf-provider">
          <option value="anthropic">Claude (Anthropic)</option>
          <option value="openai">OpenAI</option>
          <option value="gemini">Gemini (Google)</option>
          <option value="openai_compat" data-i18n="prov.compat.long"></option>
        </select>
      </label>
      <div class="compat-fields" id="pf-compat" hidden>
        <label class="field"><span data-i18n="pf.preset"></span>
          <select class="select" id="pf-preset">
            <option value="" data-i18n="pf.preset.ph"></option>
          </select>
        </label>
        <label class="field">Base URL
          <input type="url" id="pf-base" placeholder="https://…/v1" spellcheck="false">
          <small data-i18n="pf.base.help"></small>
        </label>
      </div>
      <label class="field">API key<input type="password" id="pf-key" autocomplete="off" spellcheck="false"></label>
      <label class="field">Model
        <span class="row-input">
          <input type="text" id="pf-model" list="pf-models" spellcheck="false">
          <button type="button" class="secondary-btn" id="pf-load" data-i18n="pf.load"></button>
        </span>
        <datalist id="pf-models"></datalist>
      </label>
      <p class="sheet-msg" id="pf-msg"></p>
      <div class="sheet-actions">
        <button type="button" class="secondary-btn" id="pf-cancel" data-i18n="cancel"></button>
        <button type="submit" class="primary-btn" id="pf-save" data-i18n="save"></button>
      </div>
    </form>
    <div class="sheet-actions" id="settings-actions">
      <button type="button" class="secondary-btn" id="pf-add" data-i18n="pf.add"></button>
      <button type="button" class="primary-btn" id="settings-close" data-i18n="done"></button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
